[project]
name = "standard-python-cookbook"
version = "0.1.0"
description = "Reusable strict Python quality standards you can copy into any project."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "basedpyright>=1.34.0",
    "hypothesis>=6.148.2",
    "mutmut>=3.4.0",
    "mypy>=2.3.1",
    "pre-commit>=4.5.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
