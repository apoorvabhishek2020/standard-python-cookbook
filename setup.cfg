# Mutation testing (optional). Run with: ./runtests --mutations
# Keep source_paths here in sync with source_paths in quality.toml.
# Unlike Ruff/MyPy, mutmut copies whole directories to mutate them, so this
# must never point at "." (it would also copy .venv/ and take forever).
[mutmut]
source_paths =
    src
do_not_mutate_patterns =
    tests/*
    runtests
    quality_console.py
# -o pythonpath= cancels pytest.ini's `pythonpath = src`. Without this, pytest
# re-inserts the real (unmutated) src/ ahead of mutmut's mutated copy, and
# every mutant looks "not covered by any test".
pytest_add_cli_args =
    --no-cov
    -o
    pythonpath=
